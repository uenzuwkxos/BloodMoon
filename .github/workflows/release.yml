name: Signed release

# Runs when a version tag is published (e.g. v1.0.0). Needs these GitHub Secrets
# (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    - the .jks file encoded in base64  (base64 -w0 my-key.jks)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
# The secrets only exist during the run and never show up in the repository.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Git on Windows does not keep the executable bit, so gradlew would fail with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore the keystore from the Secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish the APK to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
