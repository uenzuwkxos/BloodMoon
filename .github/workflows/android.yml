name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Git on Windows does not keep the executable bit, so gradlew would fail with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The app's build.gradle points the debug signing config at ~/.android/debug.keystore, which
      # exists on a developer machine (Android Studio creates it) but not on a fresh CI runner.
      - name: Create the debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build (debug)
        run: ./gradlew assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-moon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
